# Run any automation exactly as the Ubuntu servers do, from either platform:
#
#   docker compose run --rm rpa group-submission/carrier-portal-submission-demo
#   docker compose run --rm rpa member-submission/roster-file-validation-demo
#   docker compose run --rm rpa                  # no id: lists what is available
#
# A carrier portal that refuses headless Chromium needs a headed browser. The
# container has no display, so the entrypoint gives it a virtual one:
#
#   HEADLESS=false docker compose run --rm rpa group-submission/anthem-ca-new-plans
name: bentech-rpa

services:
  rpa:
    build:
      context: .
      dockerfile: tooling/docker/Dockerfile
    image: bentech-rpa:local

    # tini as PID 1, so SIGTERM reaches the runner and the graceful stop works:
    # the current transaction finishes, the browser closes, then the process
    # exits. Without an init, a stop signal orphans the browser instead.
    init: true

    # Chromium writes shared memory to /dev/shm; Docker's 64MB default makes it
    # crash on content-heavy pages. Raising it is the correct fix -
    # --disable-dev-shm-usage is the workaround for when you cannot.
    shm_size: 1gb

    environment:
      APP_ENV: ${APP_ENV:-dev}
      # Headless by default - faster, lighter, and right for every automation
      # that a carrier does not block.
      #
      # Anthem is the exception: its broker portal serves `Access Denied` to
      # headless Chromium. Those runs need HEADLESS=false, and the entrypoint
      # then starts a headed browser on a virtual display (xvfb) rather than
      # requiring a real one:
      #
      #   HEADLESS=false docker compose run --rm rpa group-submission/anthem-ca-new-plans
      HEADLESS: ${HEADLESS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: ${LOG_PRETTY:-false}

    # Credentials come from the environment, never from the image. Optional, so
    # a server that injects real environment variables needs no .env at all.
    env_file:
      - path: .env
        required: false

    volumes:
      # Queue state and evidence survive the container. Without these, a failed
      # run's screenshots and traces disappear with it.
      - ./data:/app/data
      - ./artifacts:/app/artifacts

    # On a Linux host whose deploy user is not uid 1000, the mounts above will be
    # unwritable by the image's `pwuser`. Fix it by matching the host uid rather
    # than by running as root:
    #   user: "${UID:-1000}:${GID:-1000}"

    command: ["group-submission/carrier-portal-submission-demo"]
